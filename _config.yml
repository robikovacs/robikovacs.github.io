title: Robert Kovacs | Software Engineer | Ruby
description: Ruby developer specialized in building elegant solutions for SaaS, e-commerce, and mobile applications.
baseurl: ""
url: "https://robikovacs.com"

author:
  name: Robert Kovacs
  url: https://robikovacs.com

permalink: /blog/:title/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/site-social-preview.png
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - README.md
  - CLAUDE.md
saas:
  enabled: false
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
