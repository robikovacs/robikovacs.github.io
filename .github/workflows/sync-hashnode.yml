name: Sync posts to Hashnode

on:
  workflow_run:
    workflows: ["Deploy Jekyll site to Pages"]
    types: [completed]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync posts to Hashnode
        env:
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
        run: |
          set -e

          GQL="https://gql.hashnode.com/"

          gql() {
            local query="$1"
            local variables="$2"
            local payload
            payload=$(jq -n --arg q "$query" --argjson v "${variables:-{\}}" '{query: $q, variables: $v}')
            curl -s -X POST "$GQL" \
              -H "Authorization: ${HASHNODE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload"
          }

          # Fetch existing posts in the publication (paginated up to 50; bump if needed)
          existing_query='query Posts($id: ObjectId!) { publication(id: $id) { posts(first: 50) { edges { node { id slug title url originalArticleURL content { markdown } tags { name slug } } } } } }'
          existing_vars=$(jq -n --arg id "$HASHNODE_PUBLICATION_ID" '{id: $id}')
          existing=$(gql "$existing_query" "$existing_vars" | jq '.data.publication.posts.edges // []')

          for post in _posts/*.md; do
            title=$(sed -n 's/^title: *"\(.*\)"/\1/p' "$post" | head -1)
            description=$(sed -n 's/^description: *"\(.*\)"/\1/p' "$post" | head -1)
            image=$(sed -n 's/^image: *\(.*\)/\1/p' "$post" | head -1)

            [ -z "$title" ] && continue

            slug=$(basename "$post" .md | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')
            canonical="https://robikovacs.com/blog/${slug}/"

            # Body: everything after the second ---
            body=$(awk '/^---$/{c++;next}c>=2' "$post")
            # Convert relative asset URLs to absolute
            body=$(echo "$body" | sed 's|(/assets/|(https://robikovacs.com/assets/|g')
            body=$(echo "$body" | sed 's|src="/assets/|src="https://robikovacs.com/assets/|g')
            # Strip leading HTML-only lines (Hashnode is markdown-first)
            body=$(echo "$body" | grep -v '^ *<')

            # Tags: comma list -> [{slug, name}]
            tags_csv=$(sed -n 's/^tags: *\(.*\)/\1/p' "$post" | head -1)
            tags_json=$(echo "$tags_csv" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | jq -R '{slug: ., name: .}' | jq -s .)

            # Cover image (absolute URL)
            cover=""
            if [ -n "$image" ]; then
              case "$image" in
                http*) cover="$image" ;;
                /*) cover="https://robikovacs.com${image}" ;;
                *) cover="https://robikovacs.com/${image}" ;;
              esac
            fi

            existing_node=$(echo "$existing" | jq --arg c "$canonical" '.[] | select(.node.originalArticleURL == $c) | .node')
            existing_id=$(echo "$existing_node" | jq -r '.id // empty')

            if [ -n "$existing_id" ]; then
              local_hash=$(echo "$body" | md5sum | cut -d' ' -f1)
              remote_body=$(echo "$existing_node" | jq -r '.content.markdown // ""')
              remote_hash=$(echo "$remote_body" | md5sum | cut -d' ' -f1)
              remote_tags=$(echo "$existing_node" | jq -r '[.tags[].slug] | sort | join(",")')
              local_tags=$(echo "$tags_json" | jq -r '[.[].slug] | sort | join(",")')
              if [ "$local_hash" = "$remote_hash" ] && [ "$local_tags" = "$remote_tags" ]; then
                echo "Skipping (unchanged): $title"
                continue
              fi
              echo "Updating: $title (id: $existing_id)"
              update_query='mutation UpdatePost($input: UpdatePostInput!) { updatePost(input: $input) { post { id url } } }'
              input=$(jq -n \
                --arg id "$existing_id" \
                --arg title "$title" \
                --arg body "$body" \
                --arg canonical "$canonical" \
                --arg subtitle "$description" \
                --arg cover "$cover" \
                --argjson tags "$tags_json" \
                '{
                   id: $id,
                   title: $title,
                   contentMarkdown: $body,
                   originalArticleURL: $canonical,
                   subtitle: ($subtitle // null),
                   tags: $tags
                 }
                 + (if $cover != "" then { coverImageOptions: { coverImageURL: $cover } } else {} end)')
              gql "$update_query" "$(jq -n --argjson i "$input" '{input: $i}')" | jq -r '.data.updatePost.post.url // .errors'
            else
              echo "Creating: $title"
              publish_query='mutation PublishPost($input: PublishPostInput!) { publishPost(input: $input) { post { id url } } }'
              input=$(jq -n \
                --arg pub "$HASHNODE_PUBLICATION_ID" \
                --arg title "$title" \
                --arg body "$body" \
                --arg slug "$slug" \
                --arg canonical "$canonical" \
                --arg subtitle "$description" \
                --arg cover "$cover" \
                --argjson tags "$tags_json" \
                '{
                   publicationId: $pub,
                   title: $title,
                   contentMarkdown: $body,
                   slug: $slug,
                   originalArticleURL: $canonical,
                   subtitle: ($subtitle // null),
                   tags: $tags
                 }
                 + (if $cover != "" then { coverImageOptions: { coverImageURL: $cover } } else {} end)')
              gql "$publish_query" "$(jq -n --argjson i "$input" '{input: $i}')" | jq -r '.data.publishPost.post.url // .errors'
            fi

            sleep 5
          done
