<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            {% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{
            site.title }}{% endif %}
        </title>

        <!-- SEO Meta Tags -->
        <meta
            name="description"
            content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}"
        />
        <meta
            name="keywords"
            content="Ruby on Rails, Software Engineer, Robert Kovacs, FirstPromoter, SaaS, Rails Performance, Lisbon Portugal"
        />
        <meta name="author" content="{{ site.author.name | default: site.author }}" />

        <!-- Canonical URL -->
        <link
            rel="canonical"
            href="{{ site.url }}{{ page.url | replace:'index.html','' }}"
        />

        <!-- Favicon -->
        <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}" />
        <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}" />
        <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16.png' | relative_url }}" />
        <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}" />
        <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}" />

        <!-- AI / LLM discoverability -->
        <link rel="help" type="text/plain" href="{{ '/llms.txt' | absolute_url }}" />

        <!-- Feed auto-discovery -->
        <link rel="alternate" type="application/atom+xml" title="{{ site.title }} (Atom)" href="{{ '/feed.xml' | absolute_url }}" />
        <link rel="alternate" type="application/rss+xml" title="{{ site.title }} (RSS)" href="{{ '/rss.xml' | absolute_url }}" />

        <!-- Mastodon verification -->
        <link rel="me" href="https://mastodon.social/@robikovacs" />

        {% seo title=false %}

        <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
    </head>
    <body>
        <main class="container" role="main">
            {{ content }}

            <footer>
                <p id="copyright"></p>
            </footer>
        </main>

        <script>
            const startYear = 2014;
            const currentYear = new Date().getFullYear();
            const yearDisplay =
                startYear === currentYear
                    ? startYear
                    : `${startYear} - ${currentYear}`;
            document.getElementById("copyright").textContent =
                `© ${yearDisplay} Robert Kovacs`;
        </script>
    </body>
</html>
